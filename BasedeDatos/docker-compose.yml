services:
  postgres:
    image: postgres:16
    container_name: servidor_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: brecha_digital
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    # Puerto del computador: 5432 por defecto. Si ya hay otro PostgreSQL
    # usando el 5432, se puede levantar con DB_PORT=5433.
    ports:
      - "${DB_PORT:-5432}:5432"

    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
